name: Update weather + WBGT

on:
  workflow_dispatch:
  schedule:
    - cron: "43 11 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_weather.py"
      - "scripts/update_wbgt.py"
      - "scripts/build_advanced_analysis.py"
      - "config/geography.json"
      - ".github/workflows/update-weather.yml"

permissions:
  contents: write

concurrency:
  # Shared with update-data.yml because both can write advanced_analysis.json and push generated data.\n  group: heat-health-generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WBGT and analysis dependencies
        run: python -m pip install --upgrade numpy pandas requests thermofeel statsmodels patsy

      - name: Fetch airport observations and build regional exposure metrics
        run: python scripts/update_weather.py

      - name: Build Liljegren outdoor WBGT archive
        run: python scripts/update_wbgt.py

      - name: Build adjusted heat-health model summaries
        run: python scripts/build_advanced_analysis.py

      - name: Commit weather and analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/weather_daily.csv \
            data/weather_region_daily.csv \
            data/weather_meta.json \
            data/wbgt_region_daily.csv \
            data/wbgt_meta.json \
            data/advanced_analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "Update regional weather, WBGT, and adjusted analysis"
            git pull --rebase origin main
            git push
          fi
