name: Validate project

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "data/weather*.csv"
      - "data/wbgt_region_daily.csv"
      - "data/advanced_analysis.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - "data/weather*.csv"
      - "data/wbgt_region_daily.csv"
      - "data/advanced_analysis.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_data.py scripts/update_weather.py scripts/update_wbgt.py scripts/build_advanced_analysis.py

      - name: Verify weather calculations and chart integration
        run: |
          python -m unittest discover -s tests
          node tests/chart.cjs
          node tests/correlation.cjs
          node tests/archive.cjs

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check weather-analysis.js
          node --check scripts/fetch_ldh.mjs

      - name: Validate JSON
        run: |
          python -m json.tool config/geography.json > /dev/null
          python -m json.tool data/advanced_analysis.json > /dev/null
          python -m json.tool data/wbgt_meta.json > /dev/null
