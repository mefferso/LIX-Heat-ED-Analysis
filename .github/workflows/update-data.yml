name: Update heat-health data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  # Shared with update-weather.yml because both can write advanced_analysis.json and push generated data.
  group: heat-health-generated-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Install adjusted-analysis dependencies
        run: python -m pip install --upgrade numpy pandas statsmodels patsy

      - name: Fetch LDH heat-related ED visits
        run: node scripts/fetch_ldh.mjs

      - name: Fetch IEM heat headlines and build merged datasets
        run: python scripts/update_data.py

      - name: Refresh adjusted heat-health model summaries
        run: python scripts/build_advanced_analysis.py

      - name: Verify published archive coverage and comparisons
        run: node tests/archive.cjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/ldh_heat_region_daily.csv \
            data/ldh_meta.json \
            data/heat_hazards_daily.csv \
            data/analysis_region_daily.csv \
            data/summary.json \
            data/advanced_analysis.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update LIX heat-health data"
            git pull --rebase origin main
            git push
          fi
