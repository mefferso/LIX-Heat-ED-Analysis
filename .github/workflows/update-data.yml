name: Update heat-health data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "data/input/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: heat-health-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build heat-health datasets
        run: python scripts/update_data.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heat_hazards_daily.csv data/analysis_region_daily.csv data/summary.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "Update LIX heat-health data"
            git pull --rebase origin main
            git push
          fi
