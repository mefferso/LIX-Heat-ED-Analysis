name: Extract LDH heat ED data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_ldh.mjs"
      - ".github/workflows/extract-ldh.yml"

permissions:
  contents: write

concurrency:
  group: ldh-tableau-extract
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Extract LDH 2023-2026 region/day HRI ED data
        run: node scripts/fetch_ldh.mjs
      - name: Commit LDH output or diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ldh_heat_region_daily.csv data/ldh_meta.json data/ldh_debug.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No LDH changes."
          else
            git commit -m "Update LDH heat ED data"
            git pull --rebase origin main
            git push
          fi
