name: Debug LDH response
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/debug_ldh.mjs"
      - ".github/workflows/debug-ldh.yml"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - run: node scripts/debug_ldh.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ldh_api_probe.json
          git commit -m "Capture LDH live response diagnostics" || exit 0
          git pull --rebase origin main
          git push
